name: Check vendored updates

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run check_updates
        run: |
          python3 buildtools/scripts/check_updates.py --format json > updates.json
          cat updates.json
          python3 buildtools/scripts/check_updates.py --check-only || echo "::warning::Updates available for vendored libraries — see updates.json"

      - name: Upload updates artifact
        uses: actions/upload-artifact@v7
        with:
          name: vendored-updates
          path: updates.json
          if-no-files-found: warn
