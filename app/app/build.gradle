apply plugin: 'com.android.application'

def getVersionCode = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--first-parent', '--count', 'master'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim())
    }
    catch (ignored) {
        return -1;
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
           // commandLine 'git', 'describe', '--abbrev=4', '--always', '--tags'
           commandLine 'git', 'describe', '--abbrev=4', '--dirty', '--always', '--tags'

            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (ignored) {
        return null;
    }
}

android {
    // AGP 7+ takes the package/namespace from here rather than the manifest.
    namespace 'de.tu_darmstadt.seemoo.nexmon'

    // Last compileSdk that still ships the android.support libraries. Kept at 28
    // so this remains a tooling-only modernization with no AndroidX source
    // migration; see MODERNIZATION.md for the AndroidX / SDK 34 follow-up.
    compileSdk 28

    sourceSets.main {
        jniLibs.srcDir 'src/main/libs' //set libs as .so's location instead of jniLibs
        jni.srcDirs = [] //disable automatic ndk-build call with auto-generated Android.mk
    }

    // compileOptions belongs directly under android{} (it was previously nested
    // inside defaultConfig, where AGP silently ignored it, so the app was really
    // compiling at the default Java level rather than the intended one).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "de.tu_darmstadt.seemoo.nexmon"
        minSdkVersion 23
        // Kept below 34 on purpose: at targetSdk 34+ context-registered
        // receivers must pass RECEIVER_EXPORTED/RECEIVER_NOT_EXPORTED, which
        // would break the signature-permission registerReceiver() calls added
        // for the broadcast hardening. Raising this is part of the AndroidX
        // follow-up in MODERNIZATION.md.
        targetSdkVersion 28

        versionCode getVersionCode()
        versionName getVersionName()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

}

dependencies {
    implementation files('libs/RootTools.jar')
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.google.code.gson:gson:2.7'
    // Pinned to a fixed version (was the floating '1.0.0.+', which makes builds
    // non-reproducible and can change under you).
    implementation 'eu.chainfire:libsuperuser:1.0.0.201704021214'
    implementation 'com.github.johnkil.print:print:1.3.1'
    implementation 'com.nononsenseapps:filepicker:3.1.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
}
